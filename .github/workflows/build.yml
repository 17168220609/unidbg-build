name: Build Unidbg CLI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: 克隆最新版 unidbg
        run: |
          git clone --depth 1 https://github.com/zhkl0228/unidbg.git unidbg-src
          cd unidbg-src
          echo "unidbg commit: $(git rev-parse --short HEAD)"
          echo "unidbg date:   $(git log -1 --format=%ci)"

      - name: 编译 unidbg 全部模块并 install 到本地仓库 (跳过测试)
        run: |
          cd unidbg-src
          mvn -q -B -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true install
          echo "=== unidbg 编译产物 ==="
          find . -name "*.jar" -path "*/target/*" | grep -v sources | head -20

      - name: 独立编译 TermAI CLI (standalone pom)
        run: |
          mvn -B -DskipTests -f cli/pom.xml package
          echo "=== CLI 产物 ==="
          ls -la cli/target/
          echo "=== 依赖 ==="
          ls cli/target/libs/ | head -40

      - name: 组装可分发包
        run: |
          set -e
          PKG="$GITHUB_WORKSPACE/unidbg-cli-pkg"
          mkdir -p "$PKG/libs"
          cp cli/target/unidbg-cli-1.0.jar "$PKG/"
          cp -r cli/target/libs/* "$PKG/libs/"
          cp launcher/unidbg "$PKG/unidbg"
          chmod +x "$PKG/unidbg"
          echo "=== 包内容 ==="
          ls -la "$PKG"
          echo "--- libs count ---"
          ls "$PKG/libs" | wc -l
          du -sh "$PKG"
          tar czf "$GITHUB_WORKSPACE/unidbg-cli-arm64.tar.gz" -C "$GITHUB_WORKSPACE" unidbg-cli-pkg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: unidbg-cli
          path: |
            unidbg-cli-arm64.tar.gz
            unidbg-cli-pkg/
          retention-days: 30
